name: PR Labeler

on:
  pull_request_target:
    paths:
      - 'custom_components/vertiv/**'
      - '.github/labeler.yml'
  workflow_dispatch:

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
